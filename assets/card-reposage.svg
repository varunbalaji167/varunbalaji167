<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 373" width="1200" height="373" role="img" aria-label="RepoSage: Ask questions about a codebase and get answers that cite the code" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="br" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00F0FF"/><stop offset=".5" stop-color="#7C3AED"/><stop offset="1" stop-color="#FF2BD6"/></linearGradient>
<filter id="g" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.k{font:600 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif}.t{font:700 30px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#E6F1FF}.s{font:400 17px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#8B949E}.b{font:400 16px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#E6F1FF}.p{font:500 14px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#E6F1FF}
.live{animation:p 2s ease-in-out infinite}@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}@media (prefers-reduced-motion:reduce){.live{animation:none}}</style></defs>
<rect x="1" y="1" width="1198" height="371" rx="14" fill="#0D1117" stroke="url(#br)" stroke-width="1.5"/>
<rect x="1" y="1" width="6" height="371" rx="3" fill="#FF2BD6" filter="url(#g)"/>
<text x="44" y="50" class="k" fill="#FF2BD6">Agentic AI</text>
<text x="44" y="88" class="t">RepoSage</text>
<text x="44" y="112" class="s">Ask questions about a codebase and get answers that cite the code</text>
<text x="44" y="156" class="b" fill="#FF2BD6">&#9656;</text><text x="66" y="156" class="b">LangGraph-orchestrated RAG over a real 20k LOC open-source repo (encode/httpx): a structured classifier routes each question to a</text><text x="66" y="179" class="b">citation-grounded explainer or a graph-backed risk scorer, behind one FastAPI endpoint</text><text x="44" y="212" class="b" fill="#FF2BD6">&#9656;</text><text x="66" y="212" class="b">Static call-graph engine using AST parsing and Class Hierarchy Analysis resolves 726+ ambiguous method calls, feeding an</text><text x="66" y="235" class="b">explainable impact × likelihood risk model built on git history</text><text x="44" y="268" class="b" fill="#FF2BD6">&#9656;</text><text x="66" y="268" class="b">Three-tier error handling and a 94-test mocked suite cover the RAG, graph and API layers, so CI runs with no API keys or network</text><rect x="44" y="315" width="107" height="28" rx="14" fill="none" stroke="#FF2BD6" stroke-opacity=".55"/><text x="97.5" y="334" text-anchor="middle" class="p">LangGraph</text><rect x="161" y="315" width="107" height="28" rx="14" fill="none" stroke="#FF2BD6" stroke-opacity=".55"/><text x="214.5" y="334" text-anchor="middle" class="p">LangChain</text><rect x="278" y="315" width="89" height="28" rx="14" fill="none" stroke="#FF2BD6" stroke-opacity=".55"/><text x="322.5" y="334" text-anchor="middle" class="p">FastAPI</text><rect x="377" y="315" width="98" height="28" rx="14" fill="none" stroke="#FF2BD6" stroke-opacity=".55"/><text x="426.0" y="334" text-anchor="middle" class="p">ChromaDB</text><rect x="485" y="315" width="98" height="28" rx="14" fill="none" stroke="#FF2BD6" stroke-opacity=".55"/><text x="534.0" y="334" text-anchor="middle" class="p">NetworkX</text>
</svg>