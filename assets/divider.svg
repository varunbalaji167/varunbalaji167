<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 10" width="1200" height="10" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="d" x1="0" x2="1">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" x2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <style>
      .s { animation: run 4s linear infinite; }
      @keyframes run { from { transform: translateX(-200px) } to { transform: translateX(1200px) } }
      @media (prefers-reduced-motion: reduce) { .s { animation: none; opacity: 0 } }
    </style>
  </defs>
  <rect y="4" width="1200" height="2" fill="url(#d)"/>
  <rect class="s" y="3" width="160" height="4" rx="2" fill="url(#spark)"/>
</svg>
