<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 396" width="590" height="396" role="img" aria-label="Faculty Recruitment System: Hiring pipeline running on IIT Indore servers" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="br" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00F0FF"/><stop offset=".5" stop-color="#7C3AED"/><stop offset="1" stop-color="#FF2BD6"/></linearGradient>
<filter id="g" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.k{font:600 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif}.t{font:700 30px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#E6F1FF}.s{font:400 17px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#8B949E}.b{font:400 16px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#E6F1FF}.p{font:500 14px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#E6F1FF}
.live{animation:p 2s ease-in-out infinite}@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}@media (prefers-reduced-motion:reduce){.live{animation:none}}</style></defs>
<rect x="1" y="1" width="588" height="394" rx="14" fill="#0D1117" stroke="url(#br)" stroke-width="1.5"/>
<rect x="1" y="1" width="6" height="394" rx="3" fill="#00F0FF" filter="url(#g)"/>
<text x="44" y="50" class="k" fill="#00F0FF">Backend in production</text><g><circle class="live" cx="506" cy="44" r="6" fill="#3DFF9A"/><text x="520" y="50" class="k" fill="#3DFF9A">Live</text></g>
<text x="44" y="88" class="t">Faculty Recruitment System</text>
<text x="44" y="112" class="s">Hiring pipeline running on IIT Indore servers</text>
<text x="44" y="156" class="b" fill="#00F0FF">&#9656;</text><text x="66" y="156" class="b">Single-page app driving a complex 11-step recruitment</text><text x="66" y="179" class="b">pipeline</text><text x="44" y="212" class="b" fill="#00F0FF">&#9656;</text><text x="66" y="212" class="b">Redis background queues for PDF dossiers and emails cut</text><text x="66" y="235" class="b">submit wait from 20s to under 2s</text><text x="44" y="268" class="b" fill="#00F0FF">&#9656;</text><text x="66" y="268" class="b">Draft persistence with MySQL JSON and role-based access</text><text x="66" y="291" class="b">for HOD and admins</text><rect x="44" y="338" width="89" height="28" rx="14" fill="none" stroke="#00F0FF" stroke-opacity=".55"/><text x="88.5" y="357" text-anchor="middle" class="p">Laravel</text><rect x="143" y="338" width="71" height="28" rx="14" fill="none" stroke="#00F0FF" stroke-opacity=".55"/><text x="178.5" y="357" text-anchor="middle" class="p">React</text><rect x="224" y="338" width="116" height="28" rx="14" fill="none" stroke="#00F0FF" stroke-opacity=".55"/><text x="282.0" y="357" text-anchor="middle" class="p">Inertia.js</text><rect x="350" y="338" width="71" height="28" rx="14" fill="none" stroke="#00F0FF" stroke-opacity=".55"/><text x="385.5" y="357" text-anchor="middle" class="p">MySQL</text><rect x="431" y="338" width="71" height="28" rx="14" fill="none" stroke="#00F0FF" stroke-opacity=".55"/><text x="466.5" y="357" text-anchor="middle" class="p">Redis</text>
</svg>