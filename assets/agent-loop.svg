<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Agent loop: think, call a tool, observe the result, repeat until done, then respond" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="exit" x1="0" x2="1">
      <stop offset="0" stop-color="#00F0FF"/><stop offset="1" stop-color="#3DFF9A"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3DFF9A"/>
    </marker>
    <style>
      .t  { font: 700 19px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #E6F1FF; }
      .d  { font: 400 14px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #8B949E; }
      .h  { font: 600 20px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #E6F1FF; }
      .m  { font: 400 15px 'Cascadia Code',Consolas,'Courier New',monospace; fill: #8B949E; }
      .core { opacity: .35; }
      .think   .core { animation: think 8s linear infinite; }
      .tool    .core { animation: tool 8s linear infinite; }
      .observe .core { animation: observe 8s linear infinite; }
      .respond .core { opacity:.2; animation: respond 8s linear infinite; }
      @keyframes think   { 0%,4%   {opacity:1} 9%,33% {opacity:.35} 36%,41% {opacity:1} 46%,70% {opacity:.35} 73%,78% {opacity:1} 83%,100% {opacity:.35} }
      @keyframes tool    { 0%,11% {opacity:.35} 12%,17% {opacity:1} 22%,48% {opacity:.35} 49%,54% {opacity:1} 59%,100% {opacity:.35} }
      @keyframes observe { 0%,23% {opacity:.35} 24%,29% {opacity:1} 34%,60% {opacity:.35} 61%,66% {opacity:1} 71%,100% {opacity:.35} }
      @keyframes respond { 0%,94% {opacity:.2} 96%,100% {opacity:.6} }
      @media (prefers-reduced-motion: reduce) {
        .core { animation: none !important; opacity: .9; }
        .pulse { display: none; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="378" rx="12" fill="#0D1117" stroke="#30363D"/>
  <text x="44" y="52" class="h">How my agents work</text>
  <text x="44" y="78" class="m">loop until the task is done, then answer</text>

  <!-- the loop -->
  <circle cx="540" cy="210" r="110" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="4 8" opacity=".6"/>
  <!-- exit to respond -->
  <path d="M540,100 C720,100 820,210 918,210" fill="none" stroke="url(#exit)" stroke-width="2" opacity=".55" marker-end="url(#arr)"/>
  <text x="742" y="132" class="m" fill="#3DFF9A">done?</text>

  <!-- travelling signal: two laps, then exits -->
  <circle class="pulse" r="7" fill="#FFFFFF" filter="url(#glow)">
    <animateMotion dur="8s" repeatCount="indefinite"
      path="M540,100 A110,110 0 0 1 635.3,265 A110,110 0 0 1 444.7,265 A110,110 0 0 1 540,100 A110,110 0 0 1 635.3,265 A110,110 0 0 1 444.7,265 A110,110 0 0 1 540,100 C720,100 820,210 918,210"/>
  </circle>

  <g class="think">
    <circle class="core" cx="540" cy="100" r="34" fill="#00F0FF" filter="url(#glow)"/>
    <circle cx="540" cy="100" r="34" fill="none" stroke="#00F0FF" stroke-width="2"/>
    <text x="490" y="84" class="t" text-anchor="end">Think</text>
    <text x="490" y="104" class="d" text-anchor="end">plan the next step</text>
  </g>
  <g class="tool">
    <circle class="core" cx="635.3" cy="265" r="34" fill="#FF2BD6" filter="url(#glow)"/>
    <circle cx="635.3" cy="265" r="34" fill="none" stroke="#FF2BD6" stroke-width="2"/>
    <text x="686" y="262" class="t">Call tool</text>
    <text x="686" y="282" class="d">search, run code, query a DB</text>
  </g>
  <g class="observe">
    <circle class="core" cx="444.7" cy="265" r="34" fill="#7C3AED" filter="url(#glow)"/>
    <circle cx="444.7" cy="265" r="34" fill="none" stroke="#A78BFA" stroke-width="2"/>
    <text x="394" y="262" class="t" text-anchor="end">Observe</text>
    <text x="394" y="282" class="d" text-anchor="end">read the result</text>
  </g>
  <g class="respond">
    <rect class="core" x="928" y="176" width="230" height="68" rx="34" fill="#3DFF9A" filter="url(#glow)"/>
    <rect x="928" y="176" width="230" height="68" rx="34" fill="none" stroke="#3DFF9A" stroke-width="2"/>
    <text x="1043" y="208" class="t" text-anchor="middle">Respond</text>
    <text x="1043" y="228" class="d" text-anchor="middle" style="fill:#B6F5D2">answer with citations</text>
  </g>
</svg>
