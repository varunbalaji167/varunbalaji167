<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Hi, I'm Varun. IIT Indore, class of 2027. I build distributed backends, agentic AI and real-time systems." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="br" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00F0FF"/><stop offset=".5" stop-color="#7C3AED"/><stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="waveclip"><rect x="0" y="0" width="150" height="80"/></clipPath>
    <style>
      .hi  { font: 800 46px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #E6F1FF; }
      .me  { font: 400 18px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #8B949E; }
      .line{ font: 500 20px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #E6F1FF; }
      .tt  { font: 700 17px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #E6F1FF; }
      .ts  { font: 400 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #8B949E; }
      .spin { animation: spin 6s linear infinite; transform-origin: 75px 52px; }
      .wave { animation: slide 2.5s linear infinite; }
      @keyframes spin  { to { transform: rotate(360deg) } }
      @keyframes slide { from { transform: translateX(0) } to { transform: translateX(-60px) } }
      @media (prefers-reduced-motion: reduce) { .spin, .wave { animation: none } .pkt { display: none } }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="14" fill="#0D1117" stroke="url(#br)" stroke-opacity=".6"/>

  <!-- intro -->
  <text x="48" y="104" class="hi">Hi, I'm Varun</text>
  <text x="50" y="140" class="me">IIT Indore, class of 2027</text>
  <text x="50" y="198" class="line">I build backends that scale</text>
  <text x="50" y="228" class="line">and AI agents that get you.</text>

  <!-- tile 1: distributed backends -->
  <g transform="translate(440,40)">
    <rect width="230" height="220" rx="12" fill="#0A1A22" stroke="#00F0FF" stroke-opacity=".45"/>
    <g transform="translate(40,26)" filter="url(#g)">
      <line x1="20" y1="20" x2="130" y2="20" stroke="#00F0FF" stroke-opacity=".4" stroke-dasharray="3 4"/>
      <line x1="20" y1="20" x2="75" y2="78" stroke="#00F0FF" stroke-opacity=".4" stroke-dasharray="3 4"/>
      <line x1="130" y1="20" x2="75" y2="78" stroke="#00F0FF" stroke-opacity=".4" stroke-dasharray="3 4"/>
      <rect x="6" y="8" width="28" height="24" rx="5" fill="#0D1117" stroke="#00F0FF" stroke-width="2"/>
      <rect x="116" y="8" width="28" height="24" rx="5" fill="#0D1117" stroke="#00F0FF" stroke-width="2"/>
      <rect x="61" y="66" width="28" height="24" rx="5" fill="#0D1117" stroke="#00F0FF" stroke-width="2"/>
      <circle class="pkt" r="4" fill="#FFFFFF"><animateMotion dur="2.4s" repeatCount="indefinite" path="M20,20 L130,20 L75,78 Z"/></circle>
      <circle class="pkt" r="4" fill="#00F0FF"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M20,20 L130,20 L75,78 Z"/></circle>
    </g>
    <text x="115" y="160" text-anchor="middle" class="tt">Distributed backends</text>
    <text x="115" y="186" text-anchor="middle" class="ts">Built to handle the load</text>
  </g>

  <!-- tile 2: agentic AI -->
  <g transform="translate(685,40)">
    <rect width="230" height="220" rx="12" fill="#1C0A22" stroke="#FF2BD6" stroke-opacity=".45"/>
    <g transform="translate(40,26)" filter="url(#g)">
      <circle cx="75" cy="52" r="38" fill="none" stroke="#FF2BD6" stroke-opacity=".35" stroke-dasharray="3 5"/>
      <circle cx="75" cy="52" r="13" fill="#FF2BD6"/>
      <g class="spin">
        <circle cx="113" cy="52" r="6" fill="#FFFFFF"/>
        <circle cx="37" cy="52" r="4" fill="#00F0FF"/>
      </g>
    </g>
    <text x="115" y="160" text-anchor="middle" class="tt">Agentic AI</text>
    <text x="115" y="186" text-anchor="middle" class="ts">Agents that do the work</text>
  </g>

  <!-- tile 3: real-time systems -->
  <g transform="translate(930,40)">
    <rect width="230" height="220" rx="12" fill="#140A26" stroke="#7C3AED" stroke-opacity=".6"/>
    <g transform="translate(40,26)" filter="url(#g)">
      <g clip-path="url(#waveclip)">
        <path class="wave" d="M0,52 q15,-34 30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0" fill="none" stroke="#A78BFA" stroke-width="3" stroke-linecap="round"/>
      </g>
      <circle cx="150" cy="52" r="5" fill="#FFFFFF"/>
    </g>
    <text x="115" y="160" text-anchor="middle" class="tt">Real-time systems</text>
    <text x="115" y="186" text-anchor="middle" class="ts">Live data, zero lag</text>
  </g>
</svg>
