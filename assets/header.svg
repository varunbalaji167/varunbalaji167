<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Varun Balaji, full-stack engineer and AI agent architect" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07070F"/>
      <stop offset="0.65" stop-color="#0D0820"/>
      <stop offset="1" stop-color="#1A0630"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" opacity="0.035"/>
    </pattern>
    <clipPath id="floor"><rect x="0" y="250" width="1200" height="90"/></clipPath>
    <style>
      .name { font: 800 76px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 6px; }
      .sub  { font: 500 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1px; }
      .mono { font: 400 19px 'Cascadia Code', Consolas, 'Courier New', monospace; }
      .ghost { animation: glitch 6s steps(1) infinite; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .node { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .n2 { animation-delay: .6s } .n3 { animation-delay: 1.2s } .n4 { animation-delay: 1.8s } .n5 { animation-delay: 2.4s }
      .grid { animation: roll 2.4s linear infinite; }
      @keyframes glitch {
        0%, 88%, 100% { opacity: 0; transform: translate(0,0); }
        89% { opacity: .85; transform: translate(-5px, 2px); }
        91% { opacity: .85; transform: translate(4px, -2px); }
        93% { opacity: 0; }
        95% { opacity: .7; transform: translate(-2px, 0); }
        96% { opacity: 0; }
      }
      @keyframes blink { 0%, 50% { opacity: 1 } 51%, 100% { opacity: 0 } }
      @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .75 } 50% { transform: scale(1.45); opacity: 1 } }
      @keyframes roll { from { transform: translateY(0) } to { transform: translateY(18px) } }
      @media (prefers-reduced-motion: reduce) {
        .ghost, .cursor, .node, .grid { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>

  <!-- synthwave floor -->
  <g clip-path="url(#floor)" stroke="#FF2BD6" stroke-width="1" opacity="0.35">
    <g class="grid">
      <line x1="0" y1="232" x2="1200" y2="232"/><line x1="0" y1="250" x2="1200" y2="250"/>
      <line x1="0" y1="268" x2="1200" y2="268"/><line x1="0" y1="286" x2="1200" y2="286"/>
      <line x1="0" y1="304" x2="1200" y2="304"/><line x1="0" y1="322" x2="1200" y2="322"/>
      <line x1="0" y1="340" x2="1200" y2="340"/>
    </g>
    <line x1="600" y1="250" x2="-600" y2="340"/><line x1="600" y1="250" x2="-200" y2="340"/>
    <line x1="600" y1="250" x2="200" y2="340"/><line x1="600" y1="250" x2="450" y2="340"/>
    <line x1="600" y1="250" x2="750" y2="340"/><line x1="600" y1="250" x2="1000" y2="340"/>
    <line x1="600" y1="250" x2="1400" y2="340"/><line x1="600" y1="250" x2="1800" y2="340"/>
  </g>
  <line x1="0" y1="250" x2="1200" y2="250" stroke="url(#sweep)" stroke-width="2" opacity="0.8" filter="url(#glow)"/>

  <!-- neural network: the cognitive-science motif -->
  <g stroke="#00F0FF" stroke-width="1.2" opacity="0.3">
    <line x1="800" y1="70"  x2="920" y2="45"/><line x1="800" y1="70"  x2="920" y2="125"/>
    <line x1="800" y1="150" x2="920" y2="125"/><line x1="800" y1="150" x2="920" y2="200"/>
    <line x1="800" y1="225" x2="920" y2="200"/><line x1="800" y1="225" x2="920" y2="125"/>
    <line x1="920" y1="45"  x2="1040" y2="95"/><line x1="920" y1="125" x2="1040" y2="95"/>
    <line x1="920" y1="125" x2="1040" y2="180"/><line x1="920" y1="200" x2="1040" y2="180"/>
    <line x1="1040" y1="95" x2="1130" y2="138"/><line x1="1040" y1="180" x2="1130" y2="138"/>
  </g>

  <!-- signals firing across synapses -->
  <g filter="url(#softglow)">
    <circle r="3.5" fill="#FF2BD6">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M800,70 L920,125 L1040,95 L1130,138"/>
    </circle>
    <circle r="3.5" fill="#00F0FF">
      <animateMotion dur="3.2s" begin="1.1s" repeatCount="indefinite" path="M800,225 L920,200 L1040,180 L1130,138"/>
    </circle>
    <circle r="3" fill="#E6F1FF">
      <animateMotion dur="3.2s" begin="2.1s" repeatCount="indefinite" path="M800,150 L920,125 L1040,180 L1130,138"/>
    </circle>
  </g>

  <g filter="url(#softglow)">
    <circle class="node"    cx="800"  cy="70"  r="6" fill="#00F0FF"/>
    <circle class="node n2" cx="800"  cy="150" r="6" fill="#00F0FF"/>
    <circle class="node n3" cx="800"  cy="225" r="6" fill="#00F0FF"/>
    <circle class="node n4" cx="920"  cy="45"  r="6" fill="#7C3AED"/>
    <circle class="node n2" cx="920"  cy="125" r="7" fill="#7C3AED"/>
    <circle class="node n5" cx="920"  cy="200" r="6" fill="#7C3AED"/>
    <circle class="node n3" cx="1040" cy="95"  r="7" fill="#FF2BD6"/>
    <circle class="node n4" cx="1040" cy="180" r="7" fill="#FF2BD6"/>
    <circle class="node"    cx="1130" cy="138" r="9" fill="#E6F1FF"/>
  </g>

  <!-- name with a periodic glitch -->
  <text class="name ghost" x="60" y="128" fill="#FF2BD6">VARUN BALAJI</text>
  <text class="name" x="60" y="128" fill="#00F0FF" filter="url(#glow)">VARUN BALAJI</text>

  <text class="sub" x="64" y="170" fill="#E6F1FF" opacity="0.9">Full-stack engineer and AI agent architect</text>
  <text class="mono" x="64" y="210" fill="#FF2BD6">&gt; <tspan fill="#E6F1FF">building systems that think</tspan><tspan class="cursor" fill="#00F0FF">&#x2588;</tspan></text>

  <rect width="1200" height="340" fill="url(#scan)"/>
  <rect x="1" y="1" width="1198" height="338" fill="none" stroke="url(#sweep)" stroke-opacity="0.5" rx="10"/>
</svg>
