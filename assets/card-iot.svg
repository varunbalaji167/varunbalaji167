<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 396" width="590" height="396" role="img" aria-label="IoT Healthcare Support: Live patient vitals from bedside sensors to dashboard" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="br" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00F0FF"/><stop offset=".5" stop-color="#7C3AED"/><stop offset="1" stop-color="#FF2BD6"/></linearGradient>
<filter id="g" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.k{font:600 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif}.t{font:700 30px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#E6F1FF}.s{font:400 17px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#8B949E}.b{font:400 16px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#E6F1FF}.p{font:500 14px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#E6F1FF}
.live{animation:p 2s ease-in-out infinite}@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}@media (prefers-reduced-motion:reduce){.live{animation:none}}</style></defs>
<rect x="1" y="1" width="588" height="394" rx="14" fill="#0D1117" stroke="url(#br)" stroke-width="1.5"/>
<rect x="1" y="1" width="6" height="394" rx="3" fill="#7C3AED" filter="url(#g)"/>
<text x="44" y="50" class="k" fill="#7C3AED">Real-time systems</text>
<text x="44" y="88" class="t">IoT Healthcare Support</text>
<text x="44" y="112" class="s">Live patient vitals from bedside sensors to dashboard</text>
<text x="44" y="156" class="b" fill="#7C3AED">&#9656;</text><text x="66" y="156" class="b">ESP32 and medical-grade sensors streaming 500+ data</text><text x="66" y="179" class="b">points per second from 10+ concurrent devices</text><text x="44" y="212" class="b" fill="#7C3AED">&#9656;</text><text x="66" y="212" class="b">MQTT to Redis Pub/Sub to Django Channels WebSockets,</text><text x="66" y="235" class="b">cutting dashboard latency by 30%</text><text x="44" y="268" class="b" fill="#7C3AED">&#9656;</text><text x="66" y="268" class="b">Integrated into a unified healthcare platform</text><rect x="44" y="315" width="80" height="28" rx="14" fill="none" stroke="#7C3AED" stroke-opacity=".55"/><text x="84.0" y="334" text-anchor="middle" class="p">Django</text><rect x="134" y="315" width="71" height="28" rx="14" fill="none" stroke="#7C3AED" stroke-opacity=".55"/><text x="169.5" y="334" text-anchor="middle" class="p">React</text><rect x="215" y="315" width="62" height="28" rx="14" fill="none" stroke="#7C3AED" stroke-opacity=".55"/><text x="246.0" y="334" text-anchor="middle" class="p">MQTT</text><rect x="287" y="315" width="71" height="28" rx="14" fill="none" stroke="#7C3AED" stroke-opacity=".55"/><text x="322.5" y="334" text-anchor="middle" class="p">Redis</text><rect x="368" y="315" width="116" height="28" rx="14" fill="none" stroke="#7C3AED" stroke-opacity=".55"/><text x="426.0" y="334" text-anchor="middle" class="p">WebSockets</text>
</svg>