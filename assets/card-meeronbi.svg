<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 396" width="590" height="396" role="img" aria-label="MeeronBi: multi-tenant antenatal care data and analytics platform on Next.js">
<defs><linearGradient id="br" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00F0FF"/><stop offset=".5" stop-color="#7C3AED"/><stop offset="1" stop-color="#FF2BD6"/></linearGradient>
<filter id="g" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.k{font:600 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif}.t{font:700 30px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#E6F1FF}.s{font:400 17px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#8B949E}.b{font:400 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#E6F1FF}.p{font:500 14px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#E6F1FF}
.live{animation:p 2s ease-in-out infinite}@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}@media (prefers-reduced-motion:reduce){.live{animation:none}}</style></defs>
<rect x="1" y="1" width="588" height="394" rx="14" fill="#0D1117" stroke="url(#br)" stroke-width="1.5"/>
<rect x="1" y="1" width="6" height="394" rx="3" fill="#00F0FF" filter="url(#g)"/>
<text x="44" y="50" class="k" fill="#00F0FF">Healthcare platform in production</text><g><circle class="live" cx="506" cy="44" r="6" fill="#3DFF9A"/><text x="520" y="50" class="k" fill="#3DFF9A">Live</text></g>
<text x="44" y="88" class="t">MeeronBi</text>
<text x="44" y="112" class="s">Antenatal care data and analytics platform</text>
<text x="44" y="156" class="b" fill="#00F0FF">&#9656;</text><text x="66" y="156" class="b">Multi-tenant Next.js platform with facility-scoped</text><text x="66" y="177" class="b">isolation and a 3-gate CI pipeline (403 unit tests)</text>
<text x="44" y="210" class="b" fill="#00F0FF">&#9656;</text><text x="66" y="210" class="b">Config-driven form engine over 7 care tabs</text><text x="66" y="231" class="b">(~137 fields) with a self-serve analytics module</text>
<text x="44" y="264" class="b" fill="#00F0FF">&#9656;</text><text x="66" y="264" class="b">k-anonymity on analytics plus a transactional outbox</text><text x="66" y="285" class="b">committing mutations, audits and emails in one txn</text>
<rect x="44" y="338" width="78" height="28" rx="14" fill="none" stroke="#00F0FF" stroke-opacity=".55"/><text x="83" y="357" text-anchor="middle" class="p">Next.js</text>
<rect x="132" y="338" width="70" height="28" rx="14" fill="none" stroke="#00F0FF" stroke-opacity=".55"/><text x="167" y="357" text-anchor="middle" class="p">Prisma</text>
<rect x="212" y="338" width="70" height="28" rx="14" fill="none" stroke="#00F0FF" stroke-opacity=".55"/><text x="247" y="357" text-anchor="middle" class="p">MySQL</text>
<rect x="292" y="338" width="88" height="28" rx="14" fill="none" stroke="#00F0FF" stroke-opacity=".55"/><text x="336" y="357" text-anchor="middle" class="p">NextAuth</text>
<rect x="390" y="338" width="112" height="28" rx="14" fill="none" stroke="#00F0FF" stroke-opacity=".55"/><text x="446" y="357" text-anchor="middle" class="p">GH Actions</text>
</svg>
