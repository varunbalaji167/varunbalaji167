name: Generate profile graphics

on:
  schedule:
    - cron: "0 */12 * * *"   # refresh twice a day
  workflow_dispatch:          # run manually from the Actions tab
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Draw activity graph and streak card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          OUT_DIR: dist
        run: |
          cat > /tmp/profile_graphics.py << 'PY'
          """Draws the neon activity graph and streak card from your real GitHub contribution data.

          Runs inside GitHub Actions (see .github/workflows/snake.yml) and writes
          dist/activity-graph.svg and dist/streak.svg, which get pushed to the `output` branch.
          """
          import json
          import os
          import sys
          import urllib.request
          from datetime import date, timedelta

          USER = os.environ.get("GH_USER", "varunbalaji167")
          TOKEN = os.environ.get("GITHUB_TOKEN", "")
          OUT = os.environ.get("OUT_DIR", "dist")

          CYAN, MAGENTA, VIOLET, INK, MUTED, BG, LINE = "#00F0FF", "#FF2BD6", "#7C3AED", "#E6F1FF", "#8B949E", "#0D1117", "#30363D"
          SANS = "'Segoe UI','Helvetica Neue',Arial,sans-serif"

          QUERY = """query($login:String!){user(login:$login){contributionsCollection{
          contributionCalendar{totalContributions weeks{contributionDays{date contributionCount}}}}}}"""


          def fetch_days():
              if os.environ.get("FAKE_DATA"):  # local preview without a token
                  import random
                  random.seed(7)
                  start = date.today() - timedelta(days=364)
                  return [(start + timedelta(d), random.choice([0, 0, 1, 2, 3, 5, 8, 12])) for d in range(365)]
              req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=json.dumps({"query": QUERY, "variables": {"login": USER}}).encode(),
                  headers={"Authorization": f"bearer {TOKEN}", "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  payload = json.load(r)
              if "errors" in payload:
                  sys.exit(f"GitHub API error: {payload['errors']}")
              weeks = payload["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]
              return [(date.fromisoformat(d["date"]), d["contributionCount"]) for w in weeks for d in w["contributionDays"]]


          def streaks(days):
              longest = run = 0
              longest_end = longest_start = run_start = days[0][0]
              for d, c in days:
                  if c > 0:
                      if run == 0:
                          run_start = d
                      run += 1
                      if run > longest:
                          longest, longest_start, longest_end = run, run_start, d
                  else:
                      run = 0
              # current streak: today may still be empty, so count back from yesterday in that case
              i = len(days) - 1
              if days[i][1] == 0:
                  i -= 1
              current, cur_end = 0, days[i][0]
              while i >= 0 and days[i][1] > 0:
                  current += 1
                  i -= 1
              cur_start = cur_end - timedelta(days=max(current - 1, 0))
              return current, cur_start, cur_end, longest, longest_start, longest_end


          def fmt(d):
              return d.strftime("%b %-d, %Y")


          def activity_svg(days):
              last = days[-31:]
              W, H, L, R, T, B = 1200, 380, 70, 30, 70, 60
              pw, ph = W - L - R, H - T - B
              peak = max(max(c for _, c in last), 4)
              top = peak + (-peak) % 4  # round up to a multiple of 4 for clean gridlines
              pts = [(L + i * pw / (len(last) - 1), T + ph - c / top * ph) for i, (_, c) in enumerate(last)]
              line = " ".join(f"{x:.1f},{y:.1f}" for x, y in pts)
              area = f"{L},{T + ph} {line} {L + pw},{T + ph}"
              grid = "".join(
                  f'<line x1="{L}" x2="{L + pw}" y1="{T + ph - k / 4 * ph:.1f}" y2="{T + ph - k / 4 * ph:.1f}" stroke="{LINE}" stroke-dasharray="3 5"/>'
                  f'<text x="{L - 14}" y="{T + ph - k / 4 * ph + 5:.1f}" text-anchor="end" class="ax">{top * k // 4}</text>'
                  for k in range(5)
              )
              xlabels = "".join(
                  f'<text x="{x:.1f}" y="{T + ph + 28}" text-anchor="middle" class="ax">{d.day}</text>'
                  for i, ((d, _), (x, _)) in enumerate(zip(last, pts)) if i % 2 == 0
              )
              dots = "".join(f'<circle cx="{x:.1f}" cy="{y:.1f}" r="4" fill="{BG}" stroke="{MAGENTA}" stroke-width="2"/>' for x, y in pts)
              total = sum(c for _, c in last)
              return f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {W} {H}" width="{W}" height="{H}" role="img" aria-label="{total} contributions in the last 31 days">
          <defs>
          <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{MAGENTA}" stop-opacity=".45"/><stop offset="1" stop-color="{VIOLET}" stop-opacity="0"/></linearGradient>
          <linearGradient id="stroke" x1="0" x2="1"><stop offset="0" stop-color="{CYAN}"/><stop offset="1" stop-color="{MAGENTA}"/></linearGradient>
          <filter id="glow" x="-5%" y="-20%" width="110%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <style>.ax{{font:400 14px {SANS};fill:{MUTED}}}.t{{font:600 20px {SANS};fill:{INK}}}.s{{font:400 15px {SANS};fill:{CYAN}}}</style>
          </defs>
          <rect width="{W}" height="{H}" rx="10" fill="{BG}"/>
          <text x="{L}" y="40" class="t">Contributions, last 31 days</text>
          <text x="{W - R}" y="40" text-anchor="end" class="s">{total} total</text>
          {grid}
          <polygon points="{area}" fill="url(#fill)"/>
          <polyline points="{line}" fill="none" stroke="url(#stroke)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
          {dots}{xlabels}
          </svg>'''


          def streak_svg(days):
              cur, cs, ce, lng, ls, le = streaks(days)
              total = sum(c for _, c in days)
              cur_range = f"{fmt(cs)} – {fmt(ce)}" if cur else "Start one today"
              lng_range = f"{fmt(ls)} – {fmt(le)}" if lng else "No streak yet"

              def col(cx, num, label, sub, color):
                  return (f'<text x="{cx}" y="98" text-anchor="middle" class="n">{num}</text>'
                          f'<text x="{cx}" y="138" text-anchor="middle" class="l" fill="{color}">{label}</text>'
                          f'<text x="{cx}" y="164" text-anchor="middle" class="d">{sub}</text>')

              return f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="Current streak {cur} days, longest {lng} days, {total} contributions in the past year">
          <defs><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <style>.n{{font:700 40px {SANS};fill:{INK}}}.l{{font:600 17px {SANS}}}.d{{font:400 13px {SANS};fill:{MUTED}}}</style></defs>
          <rect width="1200" height="200" rx="10" fill="{BG}"/>
          <line x1="400" y1="40" x2="400" y2="160" stroke="{LINE}"/><line x1="800" y1="40" x2="800" y2="160" stroke="{LINE}"/>
          {col(200, total, "Contributions, past year", f"{fmt(days[0][0])} – {fmt(days[-1][0])}", CYAN)}
          <circle cx="600" cy="84" r="46" fill="none" stroke="{MAGENTA}" stroke-width="4" filter="url(#g)"/>
          <text x="600" y="98" text-anchor="middle" class="n">{cur}</text>
          <text x="600" y="160" text-anchor="middle" class="l" fill="{MAGENTA}">Current streak</text>
          <text x="600" y="184" text-anchor="middle" class="d">{cur_range}</text>
          {col(1000, lng, "Longest streak", lng_range, CYAN)}
          </svg>'''


          if __name__ == "__main__":
              days = fetch_days()
              os.makedirs(OUT, exist_ok=True)
              for name, svg in (("activity-graph.svg", activity_svg(days)), ("streak.svg", streak_svg(days))):
                  with open(os.path.join(OUT, name), "w") as f:
                      f.write(svg)
                  print("wrote", name)
          PY
          python3 /tmp/profile_graphics.py

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF2BD6&color_dots=#ebedf0,#c7f7ff,#7ae9ff,#00c8e0,#008fa3
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF2BD6&color_dots=#161b22,#0b3d4a,#007a8a,#00b8cc,#00F0FF

      - name: Push everything to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}